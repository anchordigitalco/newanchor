<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Anchor Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Varela+Round&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#1F1E1C;
    --dark-ink:#F2F0EC;
    --accent:#FFFFFF;
    --accent-hover:#C9C6C0;
    --ink:#131313;
    --font-body:'Inter',Helvetica Neue,Arial,sans-serif;
    --font-word:'Varela Round',Helvetica Neue,Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease-soft:cubic-bezier(.4,0,.2,1);
    --tshadow:0 1px 2px rgba(10,9,7,.9),0 3px 14px rgba(10,9,7,.6),0 12px 46px rgba(10,9,7,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body);color:var(--dark-ink);
    min-height:100vh;min-height:100dvh;
    background:#0c0b0a;
    display:flex;align-items:center;justify-content:center;
    padding:2rem 1.25rem;
    position:relative;
    visibility:hidden;
  }
  body.ready{visibility:visible}
  a{color:inherit}
  .portal-bg{
    position:fixed;inset:0;z-index:0;
    background-image:url('/assets/pillars/innovation.jpg');
    background-size:cover;background-position:center;
  }
  .portal-scrim{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%,rgba(10,9,7,.35) 0%,rgba(10,9,7,.72) 100%);
  }
  .portal-home{
    position:fixed;top:1.6rem;left:1.6rem;z-index:3;
    display:flex;align-items:center;gap:.5rem;
    font-family:var(--font-word);font-size:.98rem;color:var(--dark-ink);
    text-decoration:none;text-shadow:var(--tshadow);
    opacity:.9;transition:opacity .25s var(--ease-soft);
  }
  .portal-home:hover{opacity:1}
  .portal-home img{height:20px;width:auto;filter:invert(1)}
  .portal-footer{
    position:fixed;bottom:1.2rem;left:0;right:0;z-index:3;
    text-align:center;font-size:.72rem;color:var(--dark-ink);opacity:.55;
    text-shadow:var(--tshadow);pointer-events:none;
  }
  .portal-card{
    position:relative;z-index:2;
    width:100%;max-width:26rem;
    padding:clamp(1.8rem,4vw,2.6rem);
    border-radius:24px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .portal-kicker{
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;text-transform:lowercase;
    color:var(--accent);display:flex;align-items:center;gap:.55rem;margin-bottom:1.1rem;
  }
  .portal-kicker::before{content:"";width:20px;height:1px;background:var(--accent)}
  .portal-card h1{
    font-size:clamp(1.4rem,3vw,1.7rem);line-height:1.2;margin:0 0 .5rem;font-weight:600;
    text-shadow:var(--tshadow);
  }
  .portal-lede{font-size:.9rem;opacity:.85;margin:0 0 1.7rem;line-height:1.55}
  .portal-field{margin-bottom:1.1rem}
  .portal-field label{
    display:block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.04em;
    text-transform:lowercase;opacity:.75;margin-bottom:.45rem;
  }
  .portal-field input{
    width:100%;padding:.8rem .9rem;border-radius:12px;
    background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.22);
    color:var(--dark-ink);font-family:var(--font-body);font-size:.92rem;
    transition:border-color .2s var(--ease-soft),background .2s var(--ease-soft);
  }
  .portal-field input::placeholder{color:rgba(242,240,236,.4)}
  .portal-field input:focus{outline:none;border-color:rgba(255,255,255,.55);background:rgba(0,0,0,.3)}
  .portal-submit{
    display:block;width:100%;margin-top:.4rem;padding:.9rem 1rem;border-radius:99px;border:0;cursor:pointer;
    background:var(--accent);color:var(--ink);font-family:var(--font-mono);font-size:.82rem;letter-spacing:.02em;
    text-decoration:none;text-align:center;box-sizing:border-box;
    transition:background .25s var(--ease-soft),transform .25s var(--ease-soft),opacity .2s var(--ease-soft);
  }
  .portal-submit:hover{background:var(--accent-hover);transform:translateY(-1px)}
  .portal-submit:disabled{opacity:.55;cursor:default;transform:none}
  .portal-switch{margin-top:1rem;text-align:center}
  .portal-switch button,.portal-switch a{
    background:none;border:0;padding:0;cursor:pointer;
    font-family:var(--font-body);font-size:.82rem;color:var(--dark-ink);
    text-decoration:underline;text-underline-offset:2px;opacity:.85;
  }
  .portal-switch button:hover,.portal-switch a:hover{opacity:1}
  .portal-status{
    margin-top:1rem;padding:.8rem 1rem;border-radius:12px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);
    font-size:.82rem;line-height:1.5;opacity:0;max-height:0;overflow:hidden;
    transition:opacity .3s var(--ease-soft),max-height .3s var(--ease-soft),margin-top .3s var(--ease-soft);
  }
  .portal-status.show{opacity:1;max-height:200px;margin-top:1rem}
</style>
</head>
<body class="ready">
  <div class="portal-bg" aria-hidden="true"></div>
  <div class="portal-scrim" aria-hidden="true"></div>

  <a class="portal-home" href="/" aria-label="Back to Anchor Digital">
    <img src="/assets/anchor-icon.png" alt="">
    anchor digital
  </a>

  <p class="portal-footer">&copy; <span id="year"></span> Anchor Digital Studio LLC.</p>

  <div class="portal-card">
    <p class="portal-kicker">client portal</p>
    <h1>Reset your password</h1>
    <p class="portal-lede">Enter your email and we'll send you a link to set a new password.</p>
    <form id="forgot-form">
      <div class="portal-field">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" placeholder="you@company.com" autocomplete="email" required>
      </div>
      <button class="portal-submit" type="submit" id="forgot-submit">Send reset email</button>
      <div class="portal-status" id="forgot-status" role="status" aria-live="polite"></div>
    </form>
    <p class="portal-switch">
      <a href="/portal">Back to login</a>
    </p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    var SUPABASE_URL = 'https://sroncqqparjklohbyidt.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_5buinIijAx9Y_3ZpJ3d_BA_Jd-5cpyw';
    var supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    document.getElementById('year').textContent = new Date().getFullYear();

    var forgotForm = document.getElementById('forgot-form');
    var forgotEmailInput = document.getElementById('forgot-email');
    var forgotStatus = document.getElementById('forgot-status');
    var forgotSubmit = document.getElementById('forgot-submit');

    forgotForm.addEventListener('submit', async function(e){
      e.preventDefault();
      var email = forgotEmailInput.value.trim();
      if(!email) return;
      forgotSubmit.disabled = true;
      forgotStatus.textContent = 'Sending...';
      forgotStatus.classList.add('show');
      try {
        // Supabase doesn't reveal whether the address actually has an account here, so the
        // message below stays deliberately non-committal either way. Lands on /reset-password,
        // a page dedicated to this one flow (not the login page).
        var res = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password' });
        if(res.error){
          forgotStatus.textContent = "That didn't go through (" + res.error.message + "). Try again, or email adam@anchordigitalco.com if it keeps happening.";
          forgotSubmit.disabled = false;
          return;
        }
        forgotStatus.textContent = "If that email's on our client list, we've sent a link to reset your password. Check your inbox.";
      } catch (err) {
        console.error('reset password error', err);
        forgotStatus.textContent = 'Something went wrong, try again in a moment.';
        forgotSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
