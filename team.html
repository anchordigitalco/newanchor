<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - Anchor Digital</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Varela+Round&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#1F1E1C;
    --panel:#242220;
    --dark-ink:#F2F0EC;
    --ink-faint:#A8A49D;
    --accent:#FFFFFF;
    --hairline:rgba(242,240,236,.14);
    --font-body:'Inter',Helvetica Neue,Arial,sans-serif;
    --font-word:'Varela Round',Helvetica Neue,Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease-soft:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body);color:var(--dark-ink);background:var(--dark);
    min-height:100vh;min-height:100dvh;
  }
  a{color:inherit}
  .home-link{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:1.6rem clamp(1.2rem,4vw,3rem) 0;
    font-family:var(--font-word);font-size:.98rem;text-decoration:none;
    opacity:.85;transition:opacity .2s var(--ease-soft);
  }
  .home-link:hover{opacity:1}
  .home-link img{height:18px;width:auto;filter:invert(1)}
  main{
    max-width:1100px;margin:0 auto;
    padding:2.4rem clamp(1.2rem,4vw,3rem) 6rem;
  }
  .kicker{
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;text-transform:lowercase;
    color:var(--ink-faint);display:flex;align-items:center;gap:.55rem;margin-bottom:1.1rem;
  }
  .kicker::before{content:"";width:20px;height:1px;background:var(--ink-faint)}
  h1{font-size:clamp(1.9rem,4.4vw,2.7rem);margin:0 0 .6rem;font-weight:600;line-height:1.15}
  .lede{font-size:.98rem;line-height:1.7;color:var(--ink-faint);max-width:42rem;margin:0 0 3rem}

  /* ---- founders ---- */
  .founders{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
  @media (max-width:760px){ .founders{grid-template-columns:1fr} }
  .founder{
    background:var(--panel);border:1px solid var(--hairline);border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;cursor:pointer;
    transition:border-color .25s var(--ease-soft),background .25s var(--ease-soft);
  }
  .founder:hover,.founder:focus-visible{border-color:rgba(242,240,236,.4)}
  .founder img{width:100%;aspect-ratio:4/3;object-fit:cover}
  .founder-body{padding:1.4rem 1.5rem}
  .founder-body h3{font-size:1.15rem;margin:0 0 .2rem}
  .founder-role{font-family:var(--font-mono);font-size:.68rem;color:var(--accent);letter-spacing:.05em;text-transform:lowercase;margin-bottom:.7rem;display:block}
  .founder-bio{font-size:.85rem;line-height:1.6;opacity:.88;margin:0}
  .founder-links{display:flex;gap:.6rem;margin-top:.9rem}
  .founder-links a{width:30px;height:30px;border-radius:50%;border:1px solid rgba(242,240,236,.3);display:flex;align-items:center;justify-content:center;transition:border-color .25s var(--ease-soft),background .25s var(--ease-soft)}
  .founder-links a:hover{background:rgba(242,240,236,.12);border-color:rgba(242,240,236,.7)}
  .founder-links svg{width:13px;height:13px}
  .founder-more{display:inline-block;margin-top:.8rem;font-family:var(--font-mono);font-size:.68rem;color:var(--accent);letter-spacing:.02em}

  /* ---- bio modal ---- */
  .bio-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:2rem}
  .bio-modal[hidden]{display:none}
  .bio-modal-backdrop{position:absolute;inset:0;background:rgba(8,7,6,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .3s var(--ease-soft)}
  .bio-modal-card{
    position:relative;width:min(900px,90vw);max-height:86vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--hairline);border-radius:24px;
    padding:clamp(1.8rem,4vw,2.8rem);
    display:flex;gap:1.8rem;
    opacity:0;transform:scale(.96) translateY(10px);transition:opacity .3s var(--ease-soft),transform .3s var(--ease-soft);
  }
  .bio-modal.in .bio-modal-backdrop{opacity:1}
  .bio-modal.in .bio-modal-card{opacity:1;transform:scale(1) translateY(0)}
  .bio-modal-card img{width:11rem;flex-shrink:0;aspect-ratio:1/1;object-fit:cover;border-radius:16px}
  .bio-modal-card .founder-body{padding:0}
  .bio-modal-card h3{font-size:1.5rem}
  .bio-modal-card .founder-bio{font-size:1rem;line-height:1.7;opacity:.92}
  .bio-close{
    position:absolute;top:1.1rem;right:1.1rem;width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,.3);border:1px solid var(--hairline);color:var(--dark-ink);
    font-size:1.3rem;line-height:1;cursor:pointer;
  }
  @media (max-width:640px){ .bio-modal-card{flex-direction:column} .bio-modal-card img{width:100%;aspect-ratio:16/9} }

  .page-footer{max-width:1100px;margin:4rem auto 0;padding:1.6rem clamp(1.2rem,4vw,3rem) 0;border-top:1px solid var(--hairline);font-size:.76rem;opacity:.55}
</style>
</head>
<body>

  <a class="home-link" href="/" aria-label="Back to Anchor Digital">
    <img src="assets/anchor-icon.png" alt="">
    anchor digital
  </a>

  <main>
    <p class="kicker">team</p>
    <h1>The people behind the work.</h1>
    <p class="lede">Two co-founders building Anchor Digital. Read more about the nonprofit work we're proud of on <a href="/#community" style="text-decoration:underline;text-underline-offset:2px">the studio tour</a>.</p>

    <div class="founders" id="founders"></div>
  </main>

  <p class="page-footer">&copy; <span id="year"></span> Anchor Digital Studio LLC.</p>

  <div class="bio-modal" id="bio-modal" hidden>
    <div class="bio-modal-backdrop" data-close-bio></div>
    <div class="bio-modal-card">
      <button class="bio-close" aria-label="Close" data-close-bio>&times;</button>
      <div id="bio-modal-body" style="display:flex;gap:1.8rem;width:100%"></div>
    </div>
  </div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var founders = [
    {name:"Adam Bello", role:"Co-Founder", img:"assets/team/adam-bello.jpg", linkedin:"https://www.linkedin.com/in/adam-bello-57067231a", email:"adam@anchordigitalco.com",
     bio:"Adam Evans Bello is the Co-Founder of Anchor Digital. A native New Yorker, his diverse background across corporate, athletic, and international environments shapes his approach to brand differentiation and business growth. Adam is an undergraduate student-athlete at Bowdoin College, pursuing a B.A. in Government and Legal Studies with a minor in Economics while playing point guard on the Men's Basketball team. He and Jackson founded Anchor Digital to eliminate the gap between a business's actual value and its digital presence."},
    {name:"Jackson Bleecker", role:"Co-Founder", img:"assets/team/jackson-bleecker.jpg", linkedin:"https://www.linkedin.com/in/jackson-bleecker/", email:"jackson@anchordigitalco.com",
     bio:"Jackson Bleecker is the Co-Founder of Anchor Digital. A native of West Orange, New Jersey, his background spans startup strategy, global consulting, and competitive athletics. Jackson is an undergraduate student-athlete at Bowdoin College, pursuing a B.A. in Government and Legal Studies with a minor in Economics while competing as a shooting guard on the Men's Basketball team. He co-founded Anchor Digital on a simple conviction: small businesses deserve a digital presence that actually reflects their value."}
  ];

  var linkedinSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>';
  var mailSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>';

  var foundersEl = document.getElementById('founders');
  founders.forEach(function(f, i){
    var card = document.createElement('div');
    card.className = 'founder';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', "Read " + f.name + "'s full bio");
    card.innerHTML =
      '<img src="' + f.img + '" alt="">' +
      '<div class="founder-body"><h3>' + f.name + '</h3><span class="founder-role">' + f.role + '</span>' +
      '<p class="founder-bio">' + f.bio.slice(0, 140) + '&hellip;</p>' +
      '<span class="founder-more">Read full bio &rarr;</span></div>';
    card.addEventListener('click', function(){ openBio(i); });
    card.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBio(i); } });
    foundersEl.appendChild(card);
  });

  var bioModal = document.getElementById('bio-modal');
  var bioModalBody = document.getElementById('bio-modal-body');
  function openBio(i){
    var f = founders[i];
    if(!f || !bioModal) return;
    bioModalBody.innerHTML =
      '<img src="' + f.img + '" alt="">' +
      '<div class="founder-body"><h3>' + f.name + '</h3><span class="founder-role">' + f.role + '</span>' +
      '<p class="founder-bio">' + f.bio + '</p>' +
      '<div class="founder-links">' +
      '<a href="' + f.linkedin + '" target="_blank" rel="noopener" aria-label="' + f.name + ' on LinkedIn">' + linkedinSvg + '</a>' +
      '<a href="mailto:' + f.email + '" aria-label="Email ' + f.name + '">' + mailSvg + '</a>' +
      '</div></div>';
    bioModal.hidden = false;
    requestAnimationFrame(function(){ bioModal.classList.add('in'); });
  }
  function closeBio(){
    bioModal.classList.remove('in');
    setTimeout(function(){ bioModal.hidden = true; }, 300);
  }
  bioModal.querySelectorAll('[data-close-bio]').forEach(function(el){ el.addEventListener('click', closeBio); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !bioModal.hidden) closeBio();
  });
</script>
</body>
</html>
